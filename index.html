<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>생활과 봉사 임명표</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 레이아웃: 상단 탭 → 달 선택 줄 → 주별 카드 2열(넓은 화면) / 1열(좁은 화면). 카드 안은 원래 임명표의 색 띠 구조 그대로 */
:root{
  --bg:#f6f5f9; --surface:#ffffff; --surface-2:#efedf4; --line:#dcd8e4; --line-soft:#ebe8f0;
  --fg:#1f1b29; --muted:#6c6680; --faint:#9a94ab;
  --accent:#5a2a86; --accent-soft:#ece3f5; --accent-fg:#ffffff;
  --sec1:#2c6a76; --sec2:#a9821c; --sec3:#8b2b2b; --sec0:#e6e3ec; --sec0-fg:#3c3550;
  --warn:#b4560c; --warn-soft:#fdf0e3; --ok:#2f7a4b;
  --font-ui:"IBM Plex Sans KR","Noto Sans KR",system-ui,sans-serif;
  --font-body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#15131b; --surface:#1e1b26; --surface-2:#282433; --line:#3a3547; --line-soft:#2d2938;
  --fg:#ece9f3; --muted:#a49eb6; --faint:#7a7490;
  --accent:#b58ae0; --accent-soft:#33264a; --accent-fg:#1a1424;
  --sec1:#3f8a98; --sec2:#c49b2c; --sec3:#b04545; --sec0:#2d2938; --sec0-fg:#cfc9dc;
  --warn:#f0a35e; --warn-soft:#3a2a1a; --ok:#6cc58e; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#15131b; --surface:#1e1b26; --surface-2:#282433; --line:#3a3547; --line-soft:#2d2938;
  --fg:#ece9f3; --muted:#a49eb6; --faint:#7a7490;
  --accent:#b58ae0; --accent-soft:#33264a; --accent-fg:#1a1424;
  --sec1:#3f8a98; --sec2:#c49b2c; --sec3:#b04545; --sec0:#2d2938; --sec0-fg:#cfc9dc;
  --warn:#f0a35e; --warn-soft:#3a2a1a; --ok:#6cc58e; color-scheme:dark;}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:14px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto}
header.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding-block:18px 10px}
header.top h1{font-family:var(--font-ui);font-size:20px;font-weight:700;margin:0;letter-spacing:-.01em;text-wrap:balance}
header.top h1 small{display:block;font-size:12px;font-weight:500;color:var(--muted);letter-spacing:0}
.status{margin-left:auto;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.status i{width:8px;height:8px;border-radius:50%;background:var(--faint);display:inline-block}
.status.ok i{background:var(--ok)} .status.dirty i{background:var(--warn)} .status.err i{background:var(--warn)}
nav.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:14px}
nav.tabs button{white-space:nowrap;background:none;border:0;padding:10px 14px;font-family:var(--font-ui);font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
nav.tabs button[aria-selected="true"]{color:var(--accent);border-color:var(--accent)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.chip.add{border-style:dashed;color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-size:13px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:700}
.btn.danger{color:var(--warn)}
.btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.spacer{flex:1}
.note{font-size:12px;color:var(--muted)}
.callout{background:var(--accent-soft);border-radius:var(--r);padding:10px 14px;font-size:13px;margin-bottom:12px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.callout.warn{background:var(--warn-soft)}
.summary{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin-bottom:12px}
.summary b{color:var(--fg);font-variant-numeric:tabular-nums}
.summary .bad b{color:var(--warn)}

/* 월 헤더 + 주 카드 */
.monthhead{background:var(--accent);color:var(--accent-fg);font-family:var(--font-ui);font-weight:700;text-align:center;padding:6px;border-radius:6px 6px 0 0;font-size:14px}
.weeks{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,520px),1fr));gap:14px}
.week{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;min-width:0}
.week.skip{opacity:.75}
.grid{display:grid;grid-template-columns:52px minmax(0,1fr) minmax(72px,auto) minmax(72px,auto)}
.c{padding:5px 8px;border-bottom:1px dotted var(--line-soft);display:flex;align-items:center;min-height:30px;min-width:0}
.c.date{grid-row:span 2;background:var(--sec0);color:var(--sec0-fg);font-family:var(--font-ui);font-weight:700;justify-content:center;font-variant-numeric:tabular-nums}
.c.num{color:#fff;font-weight:700;justify-content:center;font-variant-numeric:tabular-nums;border-bottom-color:rgba(255,255,255,.18)}
.c.s1{background:var(--sec1)} .c.s2{background:var(--sec2)} .c.s3{background:var(--sec3)}
.c.blank{background:var(--sec0)}
.c.title{font-size:13px;gap:6px}
.c.title .t{overflow-wrap:anywhere}
.c.gap{min-height:10px;padding:0;border-bottom:0}
.weekfoot{display:flex;gap:8px;align-items:center;padding:6px 10px;border-top:1px solid var(--line-soft);background:var(--surface-2);font-size:12px;flex-wrap:wrap}
.nm{border:1px solid transparent;background:none;border-radius:6px;padding:3px 6px;font-weight:700;font-size:13px;text-align:left;display:inline-flex;align-items:center;gap:4px;max-width:100%}
.nm:hover{border-color:var(--line);background:var(--surface-2)}
.nm.empty{color:var(--faint);font-weight:500}
.nm.asst{font-weight:500;color:var(--muted)}
.nm.issue{background:var(--warn-soft);color:var(--warn)}
.nm .lk{font-size:10px;opacity:.55}
.nm.ro{cursor:default}
.c.mainc,.c.asstc{justify-content:flex-start}
.iss{font-size:10px;color:var(--warn);font-weight:500}
.skipmsg{padding:18px 12px;text-align:center;color:var(--muted)}
/* 편집 모드 */
.ed{display:flex;gap:6px;align-items:center;flex-wrap:wrap;width:100%}
.ed input[type=text]{flex:1 1 140px;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:4px 6px;font-size:13px}
.ed select{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:3px 4px;font-size:12px;max-width:150px}
.ed label{font-size:12px;color:var(--muted);display:flex;gap:3px;align-items:center}
.x{border:0;background:none;color:var(--faint);font-size:16px;line-height:1;padding:2px 6px}
.x:hover{color:var(--warn)}
.addrow{grid-column:1/-1;display:flex;gap:6px;padding:6px 8px;border-bottom:1px dotted var(--line-soft)}
.addrow button{font-size:12px;border:1px dashed var(--line);background:none;border-radius:6px;padding:3px 8px;color:var(--muted)}

/* 선택 창 */
.ov{position:fixed;inset:0;background:rgba(20,14,30,.45);display:flex;align-items:flex-end;justify-content:center;z-index:50;
  padding:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px))}
@media (min-width:640px){.ov{align-items:center}}
.sheet{background:var(--surface);border-radius:14px 14px 0 0;width:100%;max-width:460px;max-height:82vh;display:flex;flex-direction:column;
  padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 10px 40px rgba(0,0,0,.25)}
@media (min-width:640px){.sheet{border-radius:14px}}
.sheet header{padding:14px 16px 8px;border-bottom:1px solid var(--line-soft)}
.sheet header h3{margin:0;font-family:var(--font-ui);font-size:16px}
.sheet header p{margin:2px 0 0;font-size:12px;color:var(--muted)}
.cands{overflow:auto;padding:6px}
.cand{display:grid;grid-template-columns:1fr auto;gap:2px 10px;width:100%;text-align:left;border:1px solid transparent;background:none;border-radius:8px;padding:8px 10px}
.cand:hover{background:var(--surface-2)}
.cand.cur{border-color:var(--accent);background:var(--accent-soft)}
.cand .n{font-weight:700}
.cand .m{font-size:12px;color:var(--muted);grid-column:1/-1}
.cand .tag{font-size:11px;border-radius:999px;padding:1px 7px;background:var(--surface-2);color:var(--muted);align-self:center}
.cand .tag.best{background:var(--accent);color:var(--accent-fg)}
.cand .tag.w{background:var(--warn-soft);color:var(--warn)}
.cand.dim .n{color:var(--muted)}
.sheet footer{display:flex;gap:8px;flex-wrap:wrap;padding:10px 16px 14px;border-top:1px solid var(--line-soft)}
.sheet .manual{padding:12px 16px;display:flex;gap:8px}
.sheet .manual input{flex:1;min-width:0;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--bg)}

/* 명단 */
.rolebar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.rolebar .chip b{font-variant-numeric:tabular-nums;margin-left:4px}
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,360px),1fr));gap:10px}
.person{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.person.off{opacity:.55}
.prow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.prow input.name{font-weight:700;font-size:15px;border:1px solid transparent;background:none;border-radius:6px;padding:2px 4px;width:7.5em;min-width:0}
.prow input.name:hover,.prow input.name:focus{border-color:var(--line)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{border:0;background:none;font-size:12px;padding:3px 10px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.rchips{display:flex;flex-wrap:wrap;gap:4px}
.rchip{font-size:12px;border:1px solid var(--line);background:none;border-radius:6px;padding:2px 7px;color:var(--faint)}
.rchip[aria-pressed="true"]{background:var(--accent-soft);border-color:transparent;color:var(--accent);font-weight:600}
.rchip:disabled{opacity:.35;cursor:not-allowed;text-decoration:line-through}
.pmeta{font-size:12px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.away{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.away span{font-size:12px;background:var(--warn-soft);color:var(--warn);border-radius:6px;padding:1px 4px 1px 7px;display:inline-flex;align-items:center;gap:2px}
.away span button{border:0;background:none;color:inherit;padding:0 3px}
.away input{font-size:12px;border:1px solid var(--line);border-radius:6px;padding:1px 4px;background:var(--bg)}
.addp{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.addp input{border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:var(--surface);min-width:0;flex:0 1 200px}
/* 설정 */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;max-width:760px;margin-bottom:14px}
.panel h2{font-family:var(--font-ui);font-size:16px;margin:0 0 10px}
.panel p,.panel li{max-width:65ch;color:var(--muted);font-size:13px}
.field{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.field input,.field select{border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--bg);min-width:0}
.welcome textarea{width:100%;min-height:200px;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:10px;font-size:14px;line-height:1.6}
.welcome .preview{font-size:12px;color:var(--muted)}
.gsel{border:1px solid var(--line);border-radius:999px;background:var(--surface);padding:3px 8px;font-size:12px}
.bulk{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.bulk textarea{width:100%;min-height:110px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:8px;font-size:13px}
/* 진행 단계 */
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:10px}
@media (max-width:860px){.steps{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:420px){.steps{grid-template-columns:minmax(0,1fr)}}
.step{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:10px 12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.step.now{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.step .sh{display:flex;align-items:center;gap:8px;font-family:var(--font-ui);font-weight:700}
.step .no{width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:12px;background:var(--surface-2);color:var(--muted);flex:none}
.step.now .no{background:var(--accent);color:var(--accent-fg)}
.step.done .no{background:var(--ok);color:var(--surface)}
.step .sd{font-size:12px;color:var(--muted);flex:1}
.step .btn{align-self:flex-start}
.sendbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:10px;font-size:12px;color:var(--muted)}
.hint{font-size:12px;color:var(--muted);margin:0 0 12px}
.nm.empty{border:1px dashed var(--line);color:var(--accent);font-weight:600}
.nm.blankfix{color:var(--faint);font-weight:500}
/* 통계 */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;min-width:0}
.tile .k{font-size:12px;color:var(--muted)}
.tile .v{font-family:var(--font-ui);font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.tile .v small{font-size:13px;font-weight:500;color:var(--muted);margin-left:4px}
.tile button.link{border:0;background:none;padding:0;color:var(--accent);font-size:12px;text-decoration:underline}
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table.stat{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
table.stat th,table.stat td{padding:6px 8px;border-bottom:1px solid var(--line-soft);text-align:center;white-space:nowrap}
table.stat th{font-size:12px;font-weight:600;color:var(--muted);background:var(--surface-2);position:sticky;top:0}
table.stat th button{border:0;background:none;color:inherit;font:inherit;padding:0}
table.stat th button[aria-sort]{color:var(--accent)}
table.stat .nmcol{text-align:left;position:sticky;left:0;background:var(--surface);z-index:1}
table.stat th.nmcol{background:var(--surface-2);z-index:2}
table.stat tr.row{cursor:pointer}
table.stat tr.row:hover td{background:var(--surface-2)}
table.stat td.zero{color:var(--faint)}
table.stat td.na{color:var(--line)}
.totcell{display:flex;align-items:center;gap:6px;min-width:120px}
.totcell .bar{height:8px;border-radius:0 4px 4px 0;background:var(--accent);min-width:2px}
.totcell b{min-width:1.6em;text-align:right}
tr.detail td{text-align:left;white-space:normal;background:var(--surface-2)}
.hist{display:flex;flex-wrap:wrap;gap:4px}
.hist span{font-size:12px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:1px 7px}
/* 탭 번호 */
.tno{display:inline-flex;width:18px;height:18px;border-radius:50%;align-items:center;justify-content:center;font-size:11px;background:var(--surface-2);color:var(--muted);margin-right:6px}
nav.tabs button[aria-selected="true"] .tno{background:var(--accent);color:var(--accent-fg)}
/* 사람 추가 양식 */
.addform{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:14px}
.addform h3{font-family:var(--font-ui);font-size:15px;margin:0 0 8px}
.legend{display:grid;grid-template-columns:auto minmax(0,1fr);gap:3px 10px;font-size:12px;color:var(--muted);background:var(--surface-2);border-radius:8px;padding:8px 10px;margin-bottom:8px}
.legend b{color:var(--fg);font-weight:600}
.arow{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;padding:6px 0;border-bottom:1px dotted var(--line-soft)}
.arow .ano{width:1.6em;text-align:right;color:var(--faint);font-variant-numeric:tabular-nums;font-size:12px}
.arow input{flex:1 1 150px;min-width:0;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:7px 10px;font-size:14px}
.arow.err input{border-color:var(--warn)}
.arow.off input{color:var(--muted)}
.arow .msg{flex-basis:100%;padding-left:2.2em;font-size:12px;color:var(--warn)}
.gseg button{padding:6px 11px;font-size:13px}
.gseg button+button{border-left:1px solid var(--line)}
.addline{border:1px dashed var(--line);background:none;border-radius:8px;padding:6px 12px;color:var(--muted);font-size:13px}
.addline:hover{border-color:var(--accent);color:var(--accent)}
.formfoot{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
/* 주별 파트 맞추기 창 */
.sheet.wide{max-width:660px;max-height:90vh}
.wedbody{overflow:auto;padding:12px 16px;display:flex;flex-direction:column;gap:12px}
.frow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.frow>label,.frow>.lab{min-width:4.5em;font-size:13px;color:var(--muted)}
.frow input{border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:6px 8px;min-width:0}
.secbox{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.secbox h4{margin:0;padding:6px 10px;font-size:13px;color:#fff;font-family:var(--font-ui);font-weight:600}
.secbox h4.h1c{background:var(--sec1)} .secbox h4.h2c{background:var(--sec2)} .secbox h4.h3c{background:var(--sec3)}
.secbox .in{padding:8px 10px;display:flex;flex-direction:column;gap:8px}
.prt{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding-bottom:8px;border-bottom:1px dotted var(--line-soft)}
.prt .pno{font-weight:700;color:var(--muted);width:1.2em;font-variant-numeric:tabular-nums}
.prt select,.prt input{border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:6px 8px;min-width:0;font-size:13px}
.prt .grow{flex:1 1 170px}
.prt .seg button{padding:5px 9px;font-size:12px}
.prt .seg button+button{border-left:1px solid var(--line)}
.fixed{font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.fixed b{color:var(--fg);font-weight:600}
.dbtn{border:0;background:none;color:inherit;font:inherit;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 2px;width:100%;border-radius:6px}
.dbtn small{font-size:10px;font-weight:500;color:var(--muted)}
.dbtn:hover{background:var(--surface)}
@media (max-width:480px){.dbtn .lbl{display:none}}
.planfoot{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.more{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:12px 12px 2px;margin-bottom:12px}
.dotw{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--warn);vertical-align:middle}
.gsec{font-family:var(--font-ui);font-weight:700;font-size:13px;padding:12px 0 4px;color:var(--accent);border-bottom:1px solid var(--line)}

<script>
/* 임명표 자동 배정 엔진 — 페이지와 테스트에서 함께 씀 */
(function (root, factory) {
  var api = factory();
  if (typeof module === 'object' && module.exports) module.exports = api;
  else root.Sched = api;
})(this, function () {
  'use strict';

  // 역할: 사람마다 체크하는 자격. male=true 이면 형제만
  var ROLES = [
    { key: 'chair', label: '사회', male: true },
    { key: 'talk', label: '보물 연설', male: true },
    { key: 'gems', label: '영적 보물', male: true },
    { key: 'reading', label: '성경 낭독', male: true },
    { key: 'student', label: '학생 과제', male: false },
    { key: 'assistant', label: '보조자', male: false },
    { key: 'studentTalk', label: '학생 연설', male: true },
    { key: 'living', label: '생활 파트', male: true },
    { key: 'cbs', label: '성서 연구 사회', male: true },
    { key: 'cbsReader', label: '성서 연구 낭독', male: true },
    { key: 'prayer', label: '기도', male: true }
  ];
  var ROLE = {};
  ROLES.forEach(function (r) { ROLE[r.key] = r; });
  // 학생 과제·보조자·학생 연설은 같은 순번으로 돌림
  var FAMILY = { student: 'school', assistant: 'school', studentTalk: 'school' };
  function fam(r) { return FAMILY[r] || r; }

  // 파트 종류: sec 0=시작, 1=보물, 2=봉사, 3=생활, 4=마침
  var KINDS = {
    chair: { label: '사회 · 시작 기도', sec: 0, main: 'chair' },
    talk: { label: '연설 (보물)', sec: 1, main: 'talk' },
    gems: { label: '영적 보물 찾기', sec: 1, main: 'gems' },
    reading: { label: '성경 낭독', sec: 1, main: 'reading' },
    demo: { label: '학생 과제 (보조자 있음)', sec: 2, main: 'student', asst: 'assistant', sameGender: true },
    studentTalk: { label: '학생 연설 (형제 혼자)', sec: 2, main: 'studentTalk' },
    living: { label: '생활 파트', sec: 3, main: 'living' },
    cbs: { label: '회중 성서 연구', sec: 3, main: 'cbs', asst: 'cbsReader' },
    prayer: { label: '마치는 기도', sec: 4, main: 'prayer' },
    manual: { label: '직접 입력 (방문 연사 등)', sec: null }
  };

  // 구분별 기본 자격 (사람마다 나중에 고칠 수 있음)
  var GROUPS = [
    { key: 'elder', label: '장로', gender: 'M', roles: ['chair', 'talk', 'gems', 'living', 'cbs', 'cbsReader', 'prayer'] },
    { key: 'ms', label: '봉사의 종', gender: 'M', roles: ['talk', 'gems', 'reading', 'living', 'cbsReader', 'prayer', 'student', 'assistant', 'studentTalk'] },
    { key: 'bro', label: '전도인', gender: 'M', roles: ['reading', 'student', 'assistant', 'studentTalk'] },
    { key: 'sis', label: '자매', gender: 'F', roles: ['student', 'assistant'] }
  ];
  var GROUP = {};
  GROUPS.forEach(function (g) { GROUP[g.key] = g; });
  function groupOf(p) {
    if (p.group && GROUP[p.group]) return p.group;
    if (p.gender === 'F') return 'sis';
    var r = p.roles || [];
    if (r.indexOf('chair') >= 0 || r.indexOf('cbs') >= 0) return 'elder';
    if (r.indexOf('talk') >= 0 || r.indexOf('gems') >= 0) return 'ms';
    return 'bro';
  }
  // "김철수 장로" 같은 줄 목록 → [{name, group, guessed}]
  function parseRoster(text) {
    var out = [];
    String(text || '').split(/\r?\n/).forEach(function (line) {
      var l = line.replace(/^[\s\d.)\-•·*]+/, '').replace(/[()\[\],\/]/g, ' ').replace(/봉사의\s*종/g, '봉사의종').trim();
      if (!l) return;
      var group = null, name = [];
      l.split(/\s+/).forEach(function (t) {
        var g = null;
        if (/^장로$/.test(t)) g = 'elder';
        else if (/^(봉사의종|종|MS|ms)$/.test(t)) g = 'ms';
        else if (/^(전도인|형제|형|남|M|m)$/.test(t)) g = 'bro';
        else if (/^(자매|자|여|F|f)$/.test(t)) g = 'sis';
        if (g && !group) group = g; else if (!g) name.push(t);
      });
      if (!name.length) return;
      out.push({ name: name.join(' '), group: group || 'bro', guessed: !group });
    });
    return out;
  }

  var DEFAULT_PARTS = [
    ['chair', '사회'],
    ['talk', '연설 (10분)'],
    ['gems', '영적 보물 찾기 (10분)'],
    ['reading', '성경 낭독 (4분)'],
    ['demo', '대화 시작하기 (3분)'],
    ['demo', '관심이 자라도록 돕기 (4분)'],
    ['demo', '제자가 되도록 돕기 (5분)'],
    ['living', '토의 (15분)'],
    ['cbs', '회중 성서 연구 (30분)'],
    ['prayer', '마치는 기도']
  ];

  var idc = 0;
  function uid(prefix) {
    idc++;
    return (prefix || 'p') + Date.now().toString(36).slice(-4) + Math.random().toString(36).slice(2, 6) + idc.toString(36);
  }

  function makePart(kind, title, sec) {
    return {
      id: uid('t'), kind: kind, title: title,
      sec: sec != null ? sec : (KINDS[kind].sec != null ? KINDS[kind].sec : 3),
      main: null, asst: null, text: '', noAsst: false,
      lock: { main: false, asst: false }
    };
  }
  function defaultParts() {
    return DEFAULT_PARTS.map(function (d) { return makePart(d[0], d[1]); });
  }

  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function iso(y, m, d) { return y + '-' + pad(m) + '-' + pad(d); }
  function dayNum(s) { var p = s.split('-'); return Date.UTC(+p[0], +p[1] - 1, +p[2]) / 86400000; }
  function daysBetween(a, b) { return dayNum(b) - dayNum(a); }

  // 그 달의 모임 요일 날짜 목록 (weekday: 0=일 … 6=토)
  function meetingDates(year, month, weekday) {
    var out = [];
    var last = new Date(Date.UTC(year, month, 0)).getUTCDate();
    for (var d = 1; d <= last; d++) {
      if (new Date(Date.UTC(year, month - 1, d)).getUTCDay() === weekday) out.push(iso(year, month, d));
    }
    return out;
  }
  function makeMonth(year, month, weekday) {
    return {
      weeks: meetingDates(year, month, weekday).map(function (d) {
        return { date: d, skip: false, note: '', parts: defaultParts() };
      })
    };
  }

  function slotRole(part, slot) {
    var k = KINDS[part.kind];
    if (!k) return null;
    if (slot === 'main') return k.main || null;
    if (slot === 'asst') return part.noAsst ? null : (k.asst || null);
    // 시작 기도: 비워 두면 사회자가 함. 직접 고른 경우만 따로 기록
    if (slot === 'openPrayer') return part.kind === 'chair' ? 'prayer' : null;
    return null;
  }

  var SLOTS = ['main', 'asst', 'openPrayer'];
  // 모든 달의 배정 기록 → 이벤트 목록
  function collectEvents(data, skipFn) {
    var ev = [];
    Object.keys(data.months || {}).forEach(function (mk) {
      (data.months[mk].weeks || []).forEach(function (w) {
        if (w.skip) return;
        w.parts.forEach(function (p) {
          SLOTS.forEach(function (slot) {
            var role = slotRole(p, slot);
            if (!role || !p[slot]) return;
            if (skipFn && skipFn(w, p, slot)) return;
            ev.push({ pid: p[slot], role: role, date: w.date, partId: p.id, slot: slot });
          });
        });
      });
    });
    return ev;
  }

  function personMap(data) {
    var m = {};
    (data.people || []).forEach(function (p) { m[p.id] = p; });
    return m;
  }

  function weekPids(week, exceptPart, exceptSlot) {
    var s = {};
    week.parts.forEach(function (p) {
      SLOTS.forEach(function (slot) {
        if (p === exceptPart && slot === exceptSlot) return;
        if (slotRole(p, slot) && p[slot]) s[p[slot]] = (s[p[slot]] || 0) + 1;
      });
    });
    return s;
  }

  function eligible(person, role, opts) {
    if (!person || person.active === false) return false;
    if ((person.roles || []).indexOf(role) < 0) return false;
    if (ROLE[role] && ROLE[role].male && person.gender !== 'M') return false;
    if (opts.gender && person.gender !== opts.gender) return false;
    if (opts.date && (person.away || []).indexOf(opts.date) >= 0) return false;
    return true;
  }

  // 한 사람에 대한 점수와 근거 계산
  function stats(pid, role, date, events) {
    var dRole = Infinity, dAny = Infinity, recent = 0, lastRole = null, lastAny = null, nextRole = null, roleCount = 0;
    for (var i = 0; i < events.length; i++) {
      var e = events[i];
      if (e.pid !== pid || e.date === date) continue;
      var diff = daysBetween(e.date, date); // 양수 = 과거
      var ad = Math.abs(diff);
      if (ad < dAny) dAny = ad;
      if (ad <= 28) recent++;
      if (diff > 0 && (!lastAny || e.date > lastAny)) lastAny = e.date;
      if (fam(e.role) === fam(role)) {
        roleCount++;
        if (ad < dRole) dRole = ad;
        if (diff > 0 && (!lastRole || e.date > lastRole)) lastRole = e.date;
        if (diff < 0 && (!nextRole || e.date < nextRole)) nextRole = e.date;
      }
    }
    // 같은 역할을 오래 안 했을수록, 최근 배정이 적을수록 높은 점수
    var score = Math.min(dRole, 84) + (dRole === Infinity ? 7 : 0) +
      2 * Math.min(dAny, 28) - 20 * recent;
    return { score: score, dRole: dRole, dAny: dAny, recent: recent, lastRole: lastRole, lastAny: lastAny, nextRole: nextRole, roleCount: roleCount };
  }

  // 후보 순위 (자동 배정과 선택 창이 같은 기준을 씀)
  function rank(data, events, week, part, slot, opts) {
    opts = opts || {};
    var role = slotRole(part, slot);
    if (!role) return [];
    var people = data.people || [];
    var pm = personMap(data);
    var gender = null;
    if (slot === 'asst' && KINDS[part.kind].sameGender && part.main && pm[part.main]) gender = pm[part.main].gender;
    var used = weekPids(week, part, slot);
    var other = slot === 'main' ? part.asst : part.main;
    var rng = opts.rng;
    var out = [];
    people.forEach(function (p) {
      if (p.deleted) return;
      var ok = eligible(p, role, { gender: gender, date: week.date });
      if (!ok && !opts.all) return;
      if (p.id === other) return;
      var st = stats(p.id, role, week.date, events);
      st.person = p;
      st.eligible = ok;
      st.busy = !!used[p.id];
      st.jitter = rng ? rng() * 6 : 0;
      st.total = st.score + st.jitter - (st.busy ? 1000 : 0) - (ok ? 0 : 2000);
      out.push(st);
    });
    out.sort(function (a, b) { return b.total - a.total || a.person.name.localeCompare(b.person.name, 'ko'); });
    return out;
  }

  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  // 잠기지 않은 칸을 비우고 다시 채움
  function autoAssign(data, monthKey, opts) {
    opts = opts || {};
    var month = data.months[monthKey];
    if (!month) return { filled: 0, empty: 0 };
    var rng = mulberry32(opts.seed != null ? opts.seed : Date.now() % 2147483647);
    month.weeks.forEach(function (w) {
      if (w.skip || opts.keepFilled) return;
      w.parts.forEach(function (p) {
        ['main', 'asst'].forEach(function (slot) {
          if (slotRole(p, slot) && !(p.lock && p.lock[slot])) p[slot] = null;
        });
      });
    });
    var events = collectEvents(data);
    var filled = 0, empty = 0;
    month.weeks.slice().sort(function (a, b) { return a.date < b.date ? -1 : 1; }).forEach(function (w) {
      if (w.skip) return;
      w.parts.forEach(function (p) {
        ['main', 'asst'].forEach(function (slot) {
          var role = slotRole(p, slot);
          if (!role || p[slot] || (p.lock && p.lock[slot])) return;
          var list = rank(data, events, w, p, slot, { rng: rng });
          var pick = list.length ? list[0] : null;
          if (pick) {
            p[slot] = pick.person.id;
            events.push({ pid: pick.person.id, role: role, date: w.date, partId: p.id, slot: slot });
            filled++;
          } else empty++;
        });
      });
    });
    return { filled: filled, empty: empty };
  }

  // 경고: 같은 주 중복, 성별, 자격 없음, 빈칸
  function issues(data, week) {
    var pm = personMap(data);
    var out = {};
    var used = weekPids(week);
    week.parts.forEach(function (p) {
      SLOTS.forEach(function (slot) {
        var role = slotRole(p, slot);
        if (!role) return;
        var key = p.id + ':' + slot;
        var pid = p[slot];
        if (!pid) { if (slot !== 'openPrayer' && !(p.lock && p.lock[slot])) out[key] = '빈칸'; return; }
        var person = pm[pid];
        if (!person) { if (String(pid).indexOf('txt:') !== 0) out[key] = '명단에 없음'; return; }
        if (used[pid] > 1) out[key] = '같은 주 중복';
        else if ((person.away || []).indexOf(week.date) >= 0) out[key] = '불참 날짜';
        else if ((person.roles || []).indexOf(role) < 0) out[key] = '자격 미체크';
        else if (slot === 'asst' && KINDS[p.kind].sameGender && p.main && pm[p.main] && pm[p.main].gender !== person.gender) out[key] = '성별 다름';
      });
    });
    return out;
  }

  return {
    ROLES: ROLES, ROLE: ROLE, KINDS: KINDS, GROUPS: GROUPS, GROUP: GROUP, groupOf: groupOf, parseRoster: parseRoster, DEFAULT_PARTS: DEFAULT_PARTS,
    uid: uid, makePart: makePart, defaultParts: defaultParts, makeMonth: makeMonth, meetingDates: meetingDates,
    slotRole: slotRole, collectEvents: collectEvents, rank: rank, stats: stats, autoAssign: autoAssign,
    issues: issues, SLOTS: SLOTS, daysBetween: daysBetween, personMap: personMap, mulberry32: mulberry32
  };
});

<script>
(function(){
'use strict';
var Sx = window.Sched;
var LS_KEY = 'cl-mw-schedule-draft-v1';
var D = null;              // 전체 데이터
var ui = { stat:{preset:'3',from:null,to:null,group:'',sort:'total',dir:-1,open:null,zeroOpen:false}, tab:'plan', month:null, edit:false, picker:null, roleFilter:null, confirm:null, showAll:false, exportText:null };
var save = { mode:'none', state:'ok', timer:null, art:null, dl:null };
var WD = ['일','월','화','수','목','금','토'];
var STANDALONE = !(window.claude && window.claude.use);
var SECNAME = {1:'성경에 담긴 보물',2:'야외 봉사에 힘쓰십시오',3:'그리스도인 생활'};

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function pm(){ return Sx.personMap(D); }
function md(d){ var p=d.split('-'); return (+p[1])+'/'+(+p[2]); }
function mlabel(k){ var p=k.split('-'); return p[0]+'년 '+(+p[1])+'월'; }
function monthKeys(){ return Object.keys(D.months).sort(); }
function today(){ var t=new Date(); return t.getFullYear()+'-'+('0'+(t.getMonth()+1)).slice(-2)+'-'+('0'+t.getDate()).slice(-2); }
function blank(){ return { version:1, savedAt:null, settings:{weekday:2,title:'그리스도인 생활과 봉사 계획표',cong:''}, people:[], months:{} }; }
function toast(msg){ var t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(function(){t.remove()},2200); }
function weeksAgo(d, ref){ var n=Math.round(Sx.daysBetween(d, ref)/7); return n<=0?'이번 주':n+'주 전'; }

/* ---------- 불러오기 / 저장 ---------- */
/* 교재 파트 자동 반영 (주마다 GitHub에서 받아 둔 파트 이름·시간) */
var PROG_URL='https://tordls1207-create.github.io/meeting-schedule/programs.json';
var PROG=null;
function mondayKey(d){ var t=new Date(d+'T00:00:00Z'); t.setUTCDate(t.getUTCDate()-((t.getUTCDay()+6)%7)); return t.toISOString().slice(0,10); }
function progFor(w){ return (PROG && PROG[mondayKey(w.date)]) || null; }
function s2Kind(name){ var pre=S2_PRESETS.filter(function(x){return x[0]===name})[0]; var who=pre?pre[2]:(/연설/.test(name)?'talk':'pair'); return who==='talk'?'studentTalk':'demo'; }
function applyProgram(w, pg){
  var old=w.parts.slice(), used=[];
  var take=function(pred){ for(var i=0;i<old.length;i++){ if(used.indexOf(i)<0 && pred(old[i])){ used.push(i); return old[i]; } } return null; };
  var keep=function(kind){ return take(function(p){ return p.kind===kind; }); };
  var out=[keep('chair')||Sx.makePart('chair','사회')];
  [['talk','연설'],['gems','영적 보물 찾기'],['reading','성경 낭독']].forEach(function(x,i){
    var p=keep(x[0])||Sx.makePart(x[0],x[1]); p.title=joinTitle(i===0&&pg.t1?pg.t1:x[1], (pg.s1&&pg.s1[i])||splitTitle(p.title).min); out.push(p); });
  (pg.s2||[]).forEach(function(it){ var kind=s2Kind(it[0]);
    var p=take(function(q){ return q.sec===2 && q.kind===kind; })||Sx.makePart(kind,'',2); p.title=joinTitle(it[0],it[1]); p.noAsst=false; out.push(p); });
  (pg.s3||[]).forEach(function(it){
    var p=take(function(q){ return q.kind==='living'; })||Sx.makePart('living','',3); p.title=joinTitle(it[0],it[1]); out.push(p); });
  if(pg.co){ var c=take(isCoPart)||Sx.makePart('manual','봉사 강연 (30분)',3); c.title=joinTitle(pg.co[0],pg.co[1]||30); out.push(c); if(!w.note) w.note='순회 감독자 방문'; }
  else { var b=keep('cbs')||Sx.makePart('cbs','회중 성서 연구 (30분)'); b.title=joinTitle('회중 성서 연구', pg.cbs||30); out.push(b); }
  out.push(keep('prayer')||Sx.makePart('prayer','마치는 기도'));
  w.parts=out; w.prog=mondayKey(w.date);
}
// 아직 교재를 반영하지 않은 앞으로의 주에 적용. 직접 고친 주와 확정한 달은 건드리지 않음
function applyProgramsToMonth(k, onlyNew){
  var M=D.months[k], n=0, t=today();
  if(!M || !PROG) return 0;
  if(onlyNew && monthState(M).confirmed) return 0;
  M.weeks.forEach(function(w){
    if(w.skip || w.edited) return;
    var pg=progFor(w); if(!pg) return;
    if(onlyNew && w.date<t) return;
    if(onlyNew && w.prog===mondayKey(w.date)){
      // 이미 맞춘 주: 연설 주제만 새로 생겼으면 제목만 바꿈 (배정은 그대로)
      var tk=w.parts.filter(function(q){return q.kind==='talk'})[0];
      if(tk && pg.t1){ var nt=joinTitle(pg.t1,(pg.s1&&pg.s1[0])||10); if(tk.title!==nt){ tk.title=nt; n++; } }
      return;
    }
    applyProgram(w,pg); n++;
  });
  if(n && M.weeks.every(function(w){ return w.skip || w.prog || w.edited; })) M.ready=true;
  return n;
}
async function loadPrograms(){
  try{ var r=await fetch(PROG_URL,{cache:'no-cache'}); if(!r.ok) return; var j=await r.json(); PROG=j.weeks||null; }catch(e){ return; }
  if(!PROG || !livePeople().length) return;
  var total=0;
  monthKeys().forEach(function(k){ var n=applyProgramsToMonth(k,true); if(n){ total+=n; Sx.autoAssign(D,k,{keepFilled:true}); } });
  if(total){ changed(); render(); toast('교재 내용으로 '+total+'주의 파트를 맞췄어요'); }
}

async function load(){
  var remote=null, local=null;
  try{ var r=await fetch('data.json',{cache:'no-store'}); if(r.ok) remote=await r.json(); }catch(e){}
  if(!remote && window.__SEED__) remote=window.__SEED__;
  try{ local=JSON.parse(localStorage.getItem(LS_KEY)||'null'); }catch(e){}
  var dirty=false;
  if(local && (!remote || (local.savedAt||'') > (remote.savedAt||''))){ D=local; dirty=!!remote; }
  else D=remote||blank();
  D.settings=D.settings||{weekday:2}; D.people=D.people||[]; D.months=D.months||{};
  var keys=monthKeys();
  ui.month = keys[keys.length-1] || null;
  render();

}
async function initCaps(dirty){
  if(!window.claude || !window.claude.use){ save.mode='local'; setStatus(); return; }
  try{ save.art = await window.claude.use('artifact'); }catch(e){ save.art=null; }
  try{ save.dl = await window.claude.use('downloads'); }catch(e){ save.dl=null; }
  save.mode = save.art ? 'artifact' : 'local';
  setStatus();
  if(dirty) changed();
  render();
}
function changed(){
  D.savedAt = new Date().toISOString();
  var lsFail=false;
  try{ localStorage.setItem(LS_KEY, JSON.stringify(D)); }catch(e){ lsFail=true; }
  if(save.mode!=='artifact'){ save.state='local'; setStatus(); if(lsFail) toast('이 브라우저는 저장을 막고 있어요. 백업 파일을 꼭 저장하세요'); return; }
  save.state='dirty'; setStatus();
  clearTimeout(save.timer);
  save.timer=setTimeout(flush, 2500);
}
async function flush(){
  if(save.mode!=='artifact') return;
  save.state='saving'; setStatus();
  try{
    await save.art.publish({'data.json': JSON.stringify(D)});
    save.state='ok';
    try{ localStorage.removeItem(LS_KEY); }catch(e){}
  }catch(e){
    var c=e&&e.code;
    if(c==='conflict'){ save.state='conflict'; }
    else if(['not_writer','not_granted','capability_disabled','capability_removed','not_declared','consent_required'].indexOf(c)>=0){ save.mode='local'; save.state='local'; }
    else if(c==='rate_limited'){ save.state='dirty'; clearTimeout(save.timer); save.timer=setTimeout(flush,15000); }
    else { save.state='err'; }
  }
  setStatus();
}
function setStatus(){
  var el=document.getElementById('status'); if(!el) return;
  var m={ok:['ok','저장됨'],dirty:['dirty','변경됨 · 곧 저장'],saving:['dirty','저장 중…'],err:['err','저장 실패 · 다시 시도해 주세요'],
    conflict:['err','다른 곳에서 먼저 저장됨 · 새로 불러오는 중'],local:['dirty','이 브라우저에만 저장됨']};
  var s = save.mode==='local' ? (STANDALONE?['ok','이 컴퓨터에 저장됨']:m.local) : (m[save.state]||m.ok);
  el.className='status '+s[0]; el.innerHTML='<i></i>'+esc(s[1]);
  if(save.state==='err'){ el.innerHTML+=' <button class="btn" data-act="retry" style="padding:2px 8px">다시 저장</button>'; }
}

function monthState(M){
  var st={empty:0,warn:0,filled:0,locked:0};
  M.weeks.forEach(function(w){ if(w.skip) return; var iss=Sx.issues(D,w);
    w.parts.forEach(function(p){ ['main','asst'].forEach(function(s){ if(!Sx.slotRole(p,s)) return; if(p[s]){st.filled++; if(p.lock&&p.lock[s]) st.locked++;} }); });
    Object.keys(iss).forEach(function(k){ if(iss[k]==='빈칸') st.empty++; else st.warn++; }); });
  st.ready=!!M.ready||st.filled>0;
  st.confirmed=st.filled>0&&st.empty===0&&st.locked===st.filled;
  return st;
}
function hasAssigned(M){ return M.weeks.some(function(w){ return w.parts.some(function(p){ return (p.main&&!(p.lock&&p.lock.main)) || (p.asst&&!(p.lock&&p.lock.asst)); }); }); }

function insertAt(w,sec){

  else { w.parts.forEach(function(p,j){ if(p.sec===3 && p.kind!=='cbs' && !isCoPart(p)) idx=j; }); if(idx<0) w.parts.forEach(function(p,j){ if(p.sec<=2 && p.kind!=='prayer') idx=j; }); }

function setWeekType(w,type){

function nameOf(id){ if(!id) return ''; if(String(id).indexOf('txt:')===0) return String(id).slice(4); var p=pm()[id]; return p?p.name:'(삭제된 사람)'; }
function monthRows(k){
  var rows=[]; var M=D.months[k];
  M.weeks.forEach(function(w){
    if(w.skip){ rows.push({date:w.date,no:'',title:'모임 없음'+(w.note?' ('+w.note+')':''),main:'',asst:''}); return; }
    var n=0;
    w.parts.forEach(function(p){
      var main=p.kind==='manual'?p.text:nameOf(p.main), asst=Sx.slotRole(p,'asst')?nameOf(p.asst):'';
      if(p.kind==='chair'){ rows.push({date:w.date,no:'',title:p.title,main:main,asst:''}); rows.push({date:w.date,no:'',title:'시작 기도',main:p.openPrayer?nameOf(p.openPrayer):main,asst:'',sep:!!p.openPrayer}); return; }
      var no = (p.sec>=1&&p.sec<=3)?String(++n):'';
      rows.push({date:w.date,no:no,sec:p.sec,title:p.title,main:main,asst:asst});
    });
  });
  return rows;
}
function textFor(k){
  var out=[(D.settings.cong?D.settings.cong+' 회중 ':'')+mlabel(k)+' '+(D.settings.title||'')]; var cur=null;
  var rowsAll=monthRows(k);
  rowsAll.forEach(function(r){
    if(r.date!==cur){ cur=r.date; out.push(''); out.push('■ '+md(r.date)); }
    if(r.title==='시작 기도'){ if(r.sep) out.push('시작 기도: '+(r.main||'-')); return; }
    var sepNext=r.title==='사회' && rowsAll.some(function(z){ return z.date===r.date && z.title==='시작 기도' && z.sep; });
    var t=(r.no?r.no+'. ':'')+(r.title==='사회'?(sepNext?'사회':'사회·시작 기도'):r.title)+': '+(r.main||'-')+(r.asst?' / '+r.asst:'');
    out.push(t);
  });
  return out.join('\n');
}
function csvFor(k){
  var q=function(s){ s=String(s==null?'':s); return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; };
  var lines=['날짜,번호,파트,담당,보조자'];
  monthRows(k).forEach(function(r){ lines.push([r.date,r.no,r.title,r.main,r.asst].map(q).join(',')); });
  return '﻿'+lines.join('\r\n');
}

// 두 달씩: 1·2월, 3·4월 … (홀수 달부터)
function pairOf(k){
  var y=+k.slice(0,4), m=+k.slice(5,7); if(m%2===0) m--;
  var a=y+'-'+('0'+m).slice(-2), b=y+'-'+('0'+(m+1)).slice(-2);
  return [a,b].filter(function(x){ return D.months[x]; });
}
function exportKeys(){ return ui.expPair!==false ? pairOf(ui.month) : [ui.month]; }
// PDF는 지금 보는 짝부터 마지막 달까지 두 달씩 한 장
function pdfPages(){
  if(ui.expPair===false) return [[ui.month]];
  var pages=[], seen={};
  monthKeys().forEach(function(k){ var pr=pairOf(k); if(pr[0]<pairOf(ui.month)[0]) return; var id=pr.join(); if(!seen[id]){ seen[id]=1; pages.push(pr); } });
  return pages;
}
function exportName(keys,ext){ return '임명표-'+(D.settings.cong?D.settings.cong+'-':'')+keys.join('_')+'.'+ext; }
async function sheetCanvas(keys){
  await loadLib('html2canvas','https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');
  if(!document.getElementById('sheetcss')){ var st=document.createElement('style'); st.id='sheetcss'; st.textContent=SHEET_CSS; document.head.appendChild(st); }
  var host=document.createElement('div');
  host.style.cssText='position:fixed;left:-12000px;top:0;width:'+(keys.length>1?1000:540)+'px;z-index:-1';
  host.innerHTML=sheetHtml(keys); document.body.appendChild(host);
  try{ return await window.html2canvas(host.firstChild,{scale:2,backgroundColor:'#ffffff',logging:false}); }
  finally{ host.remove(); }
}
async function makeFile(kind){
  if(ui.busy) return; ui.busy=true; render(); toast(kind==='pdf'?'PDF 만드는 중…':'이미지 만드는 중…');
  var keys=exportKeys(), blob;
  try{
    if(kind==='png'){
      var cv=await sheetCanvas(keys);
      blob=await new Promise(function(r){ cv.toBlob(r,'image/png'); });
    } else {
      await loadLib('jspdf','https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
      var pdf=new window.jspdf.jsPDF({orientation:'portrait',unit:'mm',format:'a4'});
      var pages=pdfPages(); keys=[pages[0][0], pages[pages.length-1].slice(-1)[0]].filter(function(v,i,a){return a.indexOf(v)===i;});
      for(var pi=0; pi<pages.length; pi++){
        var pc=await sheetCanvas(pages[pi]);
        var mw=190, mh=277, r=Math.min(mw/pc.width, mh/pc.height), w=pc.width*r, h=pc.height*r;
        if(pi) pdf.addPage();
        pdf.addImage(pc.toDataURL('image/jpeg',0.92),'JPEG',(210-w)/2,10,w,h);
      }
      blob=pdf.output('blob');
    }
    ui.busy=false; render();
    await download(exportName(keys,kind), blob);
  }catch(e){

    toast('만들지 못했어요. 인터넷에 연결돼 있어야 PDF·이미지를 만들 수 있어요'+(STANDALONE?' (인쇄 → PDF로 저장도 돼요)':''));
  }
}
async function download(filename, data){
  if(!save.dl){
    if(!STANDALONE){ toast('이 보기에서는 파일 저장을 쓸 수 없어요'); return; }
    var type=/\.csv$/.test(filename)?'text/csv;charset=utf-8':/\.json$/.test(filename)?'application/json;charset=utf-8':/\.png$/.test(filename)?'image/png':/\.pdf$/.test(filename)?'application/pdf':'text/html;charset=utf-8';
    var url=URL.createObjectURL(data instanceof Blob?data:new Blob([data],{type:type}));
    var a=document.createElement('a'); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){URL.revokeObjectURL(url)},4000); toast('다운로드 폴더에 저장했어요'); return;
  }
  try{ await save.dl.save({filename:filename, data:data}); toast('저장했어요'); }
  catch(e){ if(e&&e.code==='declined') return; toast('파일을 저장하지 못했어요'+(e&&e.code?' ('+e.code+')':'')); }
}

    case 'wskip': M.weeks[+el.dataset.w].skip=el.checked; break;
    case 'wdate': if(el.value){ M.weeks[+el.dataset.w].date=el.value; M.weeks.sort(function(a,b){return a.date<b.date?-1:1}); } break;
    case 'wnote': M.weeks[+el.dataset.w].note=el.value; changed(); return;
    case 'pname': D.people[+el.dataset.i].name=el.value.trim()||D.people[+el.dataset.i].name; break;
    case 'pactive': D.people[+el.dataset.i].active=el.checked; break;
    case 'pgroup': var pg=D.people[+el.dataset.i], GG=Sx.GROUP[el.value]; pg.group=el.value; pg.gender=GG.gender; pg.roles=GG.roles.slice(); if(pg.note==='구분 확인 필요'||pg.note==='성별 확인 필요') pg.note=''; break;
    case 'setCong': D.settings.cong=el.value.trim(); break;
    case 'wwd': ui.wwd=+el.value; return;
    case 'rname':
      var np=D.people.filter(function(q){return q.id===el.dataset.id})[0], nv=el.value.trim();
      if(!np) return;
      if(!nv){ toast('이름을 비울 수 없어요'); render(); return; }
      if(livePeople().some(function(q){ return q!==np && q.name.trim()===nv; })){ toast('같은 이름이 이미 있어요'); render(); return; }
      if(np.name!==nv){ np.name=nv; changed(); }
      render(); return;
    case 'wedDate': if(el.value){ var wk=wedWeek(); wk.date=el.value; M.weeks.sort(function(a,b){return a.date<b.date?-1:1}); ui.wed=M.weeks.indexOf(wk); } break;
    case 'wedNote': wedWeek().note=el.value.trim(); break;
    case 'wedCoName': wedWeek().parts[+el.dataset.p].text=el.value.trim(); break;
    case 'wedTitle': o=wedWeek().parts[+el.dataset.p]; o.title=joinTitle(el.value||(o.sec===3?'생활 파트':'학생 과제'), splitTitle(o.title).min); break;
    case 'wedMin': o=wedWeek().parts[+el.dataset.p]; o.title=joinTitle(splitTitle(o.title).name||(o.sec===3?'생활 파트':'학생 과제'), +el.value||null); break;
    case 'wedS2name':
      o=wedWeek().parts[+el.dataset.p];
      if(el.value==='custom'){ ui.wedCustom=o.id; ui.wedFocus='wt'+o.id; render(); return; }
      var pr=S2_PRESETS[+el.value]; ui.wedCustom=null;
      o.title=joinTitle(pr[0],pr[1]);
      var nk2=pr[2]==='talk'?'studentTalk':'demo'; if(o.kind!==nk2){ o.kind=nk2; clearSlots(o); } if(nk2==='demo') o.noAsst=false;
      break;
    case 'statFrom': ui.stat.from=el.value; ui.stat.preset='custom'; if(!ui.stat.to) ui.stat.to=el.value; if(ui.stat.to<ui.stat.from) ui.stat.to=el.value; render(); return;
    case 'statTo': ui.stat.to=el.value; ui.stat.preset='custom'; if(!ui.stat.from) ui.stat.from=el.value; if(ui.stat.from>ui.stat.to) ui.stat.from=el.value; render(); return;
    case 'awayAdd': if(el.value){ var pa=D.people[+el.dataset.i]; pa.away=pa.away||[]; if(pa.away.indexOf(el.value)<0) pa.away.push(el.value); pa.away.sort(); } break;
    case 'setTitle': D.settings.title=el.value; break;
    case 'setWd': D.settings.weekday=+el.value; break;
    case 'showAll': return;
    case 'restore':
      var f=el.files&&el.files[0]; if(!f) return;
      f.text().then(function(txt){ try{ var nd=JSON.parse(txt); if(!nd||!Array.isArray(nd.people)||typeof nd.months!=='object') throw 0;
        D=nd; D.settings=D.settings||{weekday:2}; ui.month=monthKeys().slice(-1)[0]||null; ui.tab='plan'; changed(); render(); toast('백업을 불러왔어요'); }catch(e){ toast('이 파일은 임명표 백업이 아니에요'); } });
      return;
    default: return;
  }
  changed(); render();
});
document.addEventListener('input', function(ev){
  var el=ev.target, a=el.dataset&&el.dataset.act;
  if(a==='dname' && ui.draft){ ui.draft[+el.dataset.i].name=el.value; var b=document.querySelector('[data-act="dsubmit"]');
    if(b){ var pr=draftProblems(), v=ui.draft.filter(function(r,i){return r.name.trim()&&!pr[i]}).length; b.textContent=(ui.draftCtx==='welcome'?'명단 만들고 시작하기':'명단에 넣기')+(v?' ('+v+'명)':''); } }
  if(a==='wcong') ui.wcong=el.value;
  if(el.id==='pq') filterCands();
});
function filterCands(){
  var qv=((document.getElementById('pq')||{}).value||'').trim(), any=false, exact=false;
  document.querySelectorAll('.cand').forEach(function(c){
    var nm=c.dataset.name||'', show = qv ? nm.indexOf(qv)>=0 : (!c.classList.contains('inel') || ui.showAll);
    c.hidden=!show; if(show) any=true; if(nm===qv) exact=true; });
  var use=document.getElementById('pqUse'); if(use){ use.hidden=!qv || exact; use.textContent='“'+qv+'” 직접 넣기'; }
  var none=document.getElementById('pqNone'); if(none) none.hidden=!!qv;
}
document.addEventListener('paste', function(ev){
  var el=ev.target; if(!el.dataset || el.dataset.act!=='dname' || !ui.draft) return;
  var txt=(ev.clipboardData||window.clipboardData).getData('text'); if(!txt || !/\n/.test(txt.trim())) return;
  ev.preventDefault();
  var list=Sx.parseRoster(txt), i=+el.dataset.i;
  list.forEach(function(r,j){ var row={name:r.name,group:r.guessed?null:r.group}; if(j===0 && !ui.draft[i].name.trim()) ui.draft[i]=row; else ui.draft.splice(i+j+(ui.draft[i].name.trim()?1:0),0,row); });
  ui.draft=ui.draft.filter(function(r,j,arr){ return r.name.trim() || j===arr.length-1; });
  render(); toast(list.length+'명을 붙여 넣었어요. 구분이 비어 있는 줄을 골라 주세요');
});
document.addEventListener('keydown', function(ev){
  if(ev.key==='Enter' && ev.target.id==='pq' && !ev.isComposing){
    ev.preventDefault(); var qv=ev.target.value.trim(); if(!qv) return;
    var first=[].filter.call(document.querySelectorAll('.cand'),function(c){return !c.hidden})[0];
    var exactBtn=[].filter.call(document.querySelectorAll('.cand'),function(c){return c.dataset.name===qv})[0];
    (exactBtn||first||document.getElementById('pqUse')).click(); return;
  }
  if(ev.key==='Enter' && ev.target.dataset && ev.target.dataset.act==='dname' && !ev.isComposing){
    ev.preventDefault(); var i=+ev.target.dataset.i;
    if(i===ui.draft.length-1){ ui.draft.push({name:'',group:null}); render(); }
    var nx=document.getElementById('dn'+(i+1)); if(nx) nx.focus(); return;
  }
  if(ev.key==='Escape' && (ui.picker||ui.exportText!=null||ui.wed!=null||ui.modal)){ ui.picker=null; ui.exportText=null; ui.wed=null; ui.modal=null; render(); }
  if(ev.key==='Enter' && ev.target.id==='newName'){ var b=document.querySelector('[data-act="addPerson"][data-g="M"]'); if(b) b.click(); }
  if(ev.key==='Enter' && ev.target.id==='manualName'){ var s=document.querySelector('[data-act="manualSave"]'); if(s) s.click(); }
});
window.addEventListener('pagehide', function(){ if(save.state==='dirty') { try{ localStorage.setItem(LS_KEY, JSON.stringify(D)); }catch(e){} } });

load();
})();
</script>
