name: 주간 교재 파트 업데이트

on:
  schedule:
    - cron: '0 1 * * 1'   # 매주 월요일 10:00 (한국 시간)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/fetch-programs.mjs
      - name: 바뀐 내용이 있으면 저장
        run: |
          if git diff --quiet programs.json; then echo "변경 없음"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add programs.json
          git commit -m "교재 파트 업데이트"
          git push
